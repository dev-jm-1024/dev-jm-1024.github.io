<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Download Resume</title>
</head>
<body>
<script>
    // GitHub Pages 환경에서 작동하도록 수정
    const fileName = '신입백엔드개발자_이재민_이력서_및_자기소개서.pdf';
    const link = document.createElement('a');
    
    // 절대 경로 사용
    link.href = '/doc/' + encodeURIComponent(fileName);
    link.download = fileName;
    
    document.body.appendChild(link);
    link.click();
    
    // Fallback
    setTimeout(() => {
        window.location.href = '/doc/' + encodeURIComponent(fileName);
    }, 500);
</script>
</body>
</html>
