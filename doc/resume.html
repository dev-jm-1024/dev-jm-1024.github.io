<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Download Resume</title>
</head>
<body>
<script>
    const fileName = '신입백엔드개발자_이재민_이력서_및_자기소개서.pdf';
    const link = document.createElement('a');

    // 절대경로(/doc/) 대신 상대경로(doc/) 사용
    link.href = 'doc/' + encodeURIComponent(fileName);
    link.download = fileName;

    document.body.appendChild(link);
    link.click();
    link.remove();
</script>
</body>
</html>
